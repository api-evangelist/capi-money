aid: capi-money
name: Capi Money
description: 'Capi Money is a cross-border payments fintech that lets businesses pay
  their suppliers in more than 30 currencies, targeting importers in Africa and other
  emerging markets who have historically faced high fees and multi-week settlement
  times on international invoices. Founded in 2023 by Mitch Riley and Scott Liddle
  and headquartered in Wilmington, Delaware, the company offers instant FX rate quotes,
  settlement within 24 hours, real-time payment tracking, and holds customer funds
  with licensed financial institutions. Capi is a Y Combinator company backed by
  Creandum, Firstminute Capital, and Raba, having raised roughly EUR 17.2 million
  in Series A funding. The product is delivered through a web application (app.capimoney.com)
  and an FX Partner Program; there is no public developer API, OpenAPI definition,
  or developer portal published at this time.'
